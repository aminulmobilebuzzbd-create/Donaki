name: Demo screenshots

# Actions ট্যাব থেকে "Run workflow" চাপলে ডেমো হিসাবসহ অ্যাপের ছবি তোলে।
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/screenshots.yml'
      - 'tool/screenshots.sh'
      - 'lib/demo_data.dart'

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build demo APK
        run: |
          flutter create --org com.dokani --project-name dokani --platforms android .
          rm -f test/widget_test.dart
          python3 tool/patch_android.py
          flutter pub get
          flutter build apk --release --dart-define=DEMO_DATA=true --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-release.apk dokani-demo.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app in emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tool/screenshots.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
