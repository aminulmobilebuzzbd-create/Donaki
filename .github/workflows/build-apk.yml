name: Build Android APK

# main ব্রাঞ্চে কোড গেলে, অথবা Actions ট্যাব থেকে "Run workflow" চাপলে APK তৈরি হয়।
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform folder
        run: |
          flutter create --org com.dokani --project-name dokani --platforms android .
          rm -f test/widget_test.dart
          python3 tool/patch_android.py
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk dokani.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dokani-apk
          path: dokani.apk

      # ফোন থেকে সহজে ডাউনলোডের জন্য Releases পেজে APK রাখা হয়
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: দোকানি build ${{ github.run_number }}
          body: ফোনে dokani.apk ডাউনলোড করে ইনস্টল করুন।
          files: dokani.apk
