name: dokani
description: "দোকানি - দোকানের বাকি খাতা, বেচাকেনা ও স্টকের হিসাব। পুরো অফলাইন।"
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  path: ^1.9.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  mobile_scanner: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

# অ্যাপের আইকন (দোকানের লোগো)। বিল্ডের সময় `dart run flutter_launcher_icons` চালালে তৈরি হয়।
flutter_launcher_icons:
  android: true
  ios: false  # iOS এ বানালে true করে দিন
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#141414"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true

# অ্যাপ চালু হওয়ার মুহূর্তের পর্দা: কালো পটভূমিতে লোগো। `dart run flutter_native_splash:create` চালালে তৈরি হয়।
flutter_native_splash:
  color: "#161616"
  image: assets/brand/logo.png
  android_12:
    color: "#161616"
    image: assets/icon/icon_foreground.png
    icon_background_color: "#161616"
  ios: false
